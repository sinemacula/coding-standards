# ==============================================================================
# QUALITY GATES
# ==============================================================================
name: Quality Gates

# ==============================================================================
# TRIGGERS
# ==============================================================================
on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    schedule:
        -   cron: 0 7 * * 1
    workflow_dispatch:

# ==============================================================================
# CONCURRENCY
# ==============================================================================
# The event name keeps scheduled and manual runs out of the push group, so a
# merge to master cannot cancel one part way through.
concurrency:
    group: quality-gates-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
    cancel-in-progress: true

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: read

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: SCOPED MUTATION GATE (PR + PUSH)
    # ==========================================================================
    mutation:
        if: ${{ github.event_name != 'schedule' }}
        name: Mutation / PHP 8.3
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v5
                with:
                    persist-credentials: false
                    fetch-depth: 0

            # This repo diverges from the shared setup-php action, which pins
            # the coverage driver to pcov: php_codesniffer loads sniffs through
            # its own include()-based autoloader, which pcov does not instrument
            # (it reports 0%). Xdebug is the only driver that sees them, so it
            # is set directly.
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.3
                    coverage: xdebug
                    tools: composer

            # The suite supports phpcs 3.x and 4.x; the mutation leg pins the
            # 4.x major consumers run so the mutant population stays stable
            # run-to-run.
            -   name: Install dependencies
                run: >
                    composer update --prefer-dist --no-interaction --no-progress
                    --with "squizlabs/php_codesniffer:^4.0.2"

            # On a push, origin/master is the pushed commit itself, so the gate
            # diffs against the commit master moved from. A push that rewrote
            # master instead of moving it forward leaves no such base.
            -   name: Scoped mutation gate
                env:
                    BEFORE: ${{ github.event.before }}
                run: |
                    base=origin/master
                    if [ "$GITHUB_EVENT_NAME" = push ]; then
                        if ! git merge-base --is-ancestor "$BEFORE" HEAD 2>/dev/null; then
                            echo "::error::master did not move forward from ${BEFORE}, so the changed lines are unknown; run the full mutation suite."
                            exit 1
                        fi
                        base=$BEFORE
                    fi
                    composer test:mutation -- --git-diff-base="$base"

    # ==========================================================================
    # JOB: FULL MUTATION SUITE (SCHEDULED + MANUAL)
    # ==========================================================================
    mutation-full:
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        name: Mutation Full / PHP 8.3
        runs-on: ubuntu-latest
        timeout-minutes: 60

        steps:
            -   name: Checkout
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            # This repo diverges from the shared setup-php action, which pins
            # the coverage driver to pcov: php_codesniffer loads sniffs through
            # its own include()-based autoloader, which pcov does not instrument
            # (it reports 0%). Xdebug is the only driver that sees them, so it
            # is set directly.
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: 8.3
                    coverage: xdebug
                    tools: composer

            # The suite supports phpcs 3.x and 4.x; the mutation leg pins the
            # 4.x major consumers run so the mutant population stays stable
            # run-to-run.
            -   name: Install dependencies
                run: >
                    composer update --prefer-dist --no-interaction --no-progress
                    --with "squizlabs/php_codesniffer:^4.0.2"

            -   name: Full mutation suite
                run: composer test:mutation:full
