# ============================================================================
# NPM publish workflow
# ----------------------------------------------------------------------------
# Publishes @sinemacula/coding-standards to npmjs.com when a `v*` git tag is
# pushed. The tag's version must match `package.json`'s `version` field —
# the workflow refuses to publish on a mismatch.
#
# Required repo secret:
#   NPM_TOKEN  — npm automation token with publish access for the
#                @sinemacula scope. Create at https://www.npmjs.com/settings/<user>/tokens
#                with type "Automation" and scope "Publish".
# ============================================================================

name: npm-publish

on:
    push:
        tags:
            -   'v*'

permissions:
    contents: read
    id-token: write

jobs:
    publish:
        name: Publish to npm
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v4

            -   name: Set up Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: '20'
                    registry-url: 'https://registry.npmjs.org/'

            -   name: Verify tag matches package.json version
                run: |
                    TAG_VERSION="${GITHUB_REF_NAME#v}"
                    PKG_VERSION="$(node -p 'require(\"./package.json\").version')"
                    if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
                        echo "Tag $GITHUB_REF_NAME (=> $TAG_VERSION) does not match package.json version $PKG_VERSION" >&2
                        exit 1
                    fi
                    echo "Publishing $PKG_VERSION"

            -   name: Show packed file list (dry run)
                run: npm pack --dry-run

            -   name: Publish
                run: npm publish --provenance --access public
                env:
                    NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
