# ==============================================================================
# TESTS
# ==============================================================================
name: Tests

# ==============================================================================
# TRIGGERS
# ==============================================================================
on:
    push:
        branches: [ master ]
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]
    workflow_dispatch:

# ==============================================================================
# CONCURRENCY
# ==============================================================================
concurrency:
    group: tests-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions:
    contents: read
    id-token: write

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: TESTS
    # ==========================================================================
    tests:
        name: Test / PHP ${{ matrix.php }} / phpcs ${{ matrix.phpcs }}
        runs-on: ubuntu-latest

        # Consumers run the sniffs under phpcs 4.x via qlty, so the suite is
        # tested against both the 3.x and 4.x token streams. The resolver pulls
        # the slevomat line that matches each phpcs major automatically.
        strategy:
            fail-fast: false
            matrix:
                php: [ 8.3, 8.4, 8.5 ]
                phpcs: [ 3, 4 ]
                include:
                    -   phpcs: 3
                        constraint: '^3.13'
                    -   phpcs: 4
                        constraint: '^4.0'

        steps:
            -   name: Checkout
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            # This repo diverges from the shared setup-php action, which pins the
            # coverage driver to pcov: php_codesniffer loads sniffs through its own
            # include()-based autoloader, which pcov does not instrument (it reports
            # 0%). Xdebug is the only driver that sees them, so it is set directly.
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: ${{ matrix.php }}
                    coverage: xdebug
                    tools: composer

            -   name: Install dependencies
                run: >
                    composer update --prefer-dist --no-interaction --no-progress
                    --with "squizlabs/php_codesniffer:${{ matrix.constraint }}"

            -   name: PHPUnit
                run: composer test:coverage

            -   name: Publish code coverage
                if: >-
                    ${{ github.event_name == 'push' && github.ref == 'refs/heads/master'
                    && matrix.php == '8.3' && matrix.phpcs == 4 }}
                uses: qltysh/qlty-action/coverage@v2
                with:
                    oidc: true
                    files: clover.xml

    # ==========================================================================
    # JOB: JS RULE TESTS
    # ==========================================================================
    js-tests:
        name: Test / ESLint rules
        runs-on: ubuntu-latest

        steps:
            -   name: Checkout
                uses: actions/checkout@v5
                with:
                    persist-credentials: false

            -   name: Setup Node.js
                uses: actions/setup-node@v4
                with:
                    node-version: '26'
                    cache: npm

            -   name: Install dependencies
                run: npm ci

            -   name: Vitest
                run: npm run test:js
