name: Dependency Updates

on:
    release:
        types: [ published ]
    workflow_dispatch:

concurrency:
    group: dependency-updates
    cancel-in-progress: false

permissions: {}

defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: DISPATCH
    # ==========================================================================
    dispatch:
        name: Dispatch
        runs-on: ubuntu-latest

        steps:
            -   name: Trigger the dependency-updates worker
                env:
                    GH_TOKEN: ${{ secrets.DEPENDENCIES_DISPATCH_TOKEN }}
                run: |
                    gh api -X POST \
                        repos/sinemacula/dependency-updates-worker/dispatches \
                        -f event_type=coding-standards-released
