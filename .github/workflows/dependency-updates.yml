# ==============================================================================
# DEPENDENCY UPDATES
# ==============================================================================
name: Dependency Updates

# ==============================================================================
# TRIGGERS
# ==============================================================================
on:
    release:
        types: [ published ]
    workflow_dispatch:

# ==============================================================================
# CONCURRENCY
# ==============================================================================
concurrency:
    group: dependency-updates
    cancel-in-progress: false

# ==============================================================================
# PERMISSIONS
# ==============================================================================
permissions: {}

# ==============================================================================
# DEFAULTS
# ==============================================================================
defaults:
    run:
        shell: bash

jobs:

    # ==========================================================================
    # JOB: DISPATCH
    # ==========================================================================
    dispatch:
        name: Dispatch
        runs-on: ubuntu-latest

        steps:

            -   name: Trigger the dependency-updates worker
                env:
                    GH_TOKEN: ${{ secrets.DEPENDENCY_DISPATCH_TOKEN }}
                run: |
                    gh api -X POST \
                        repos/sinemacula/dependency-updates-worker/dispatches \
                        -f event_type=coding-standards-released
