config_version = "0"

# Release-please writes CHANGELOG.md with `*` bullets; markdownlint (MD004)
# enforces `-`. The file is tool-generated, so exclude it from markdownlint.
[[exclude]]
plugins = ["markdownlint"]
file_patterns = ["**/CHANGELOG.md"]

# The qlty-generated git hooks carry tab indentation; they are tool-authored, so
# their indent style is not ours to fix. Exclude them from editorconfig-checker.
[[exclude]]
plugins = ["editorconfig-checker"]
file_patterns = [".qlty/hooks/**"]

# Test code is exercised by the suite, so its smells are not reported here.
[[exclude]]
plugins = ["radarlint-php"]
file_patterns = ["tests/**"]

# The ESLint config lives under .qlty, and linting it would flag the file itself.
[[exclude]]
plugins = ["eslint"]
file_patterns = [".qlty/**"]

[runtimes.enabled]
php = "8.3"

# The plugins, versions and modes every consumer runs; a plugin with nothing to
# lint in a repository does not run there. A consumer's own entry for the same
# plugin falls back to the version and mode set here when it leaves them out, but
# any list it sets, drivers included, replaces the one here rather than adding to
# it, and an entry that sets no drivers runs all of them.
[[plugin]]
name = "trufflehog"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "yamllint"

[[plugin]]
name = "actionlint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "trivy"
drivers = ["config", "fs-vuln"]

[[plugin]]
name = "editorconfig-checker"

[[plugin]]
name = "php-codesniffer"
version = "4.0.4"
mode = "comment"

[[plugin]]
name = "php-cs-fixer"
version = "3.95.25"

[[plugin]]
name = "radarlint-php"
mode = "comment"

# Code smells for every consumer. A threshold flags at that value or more. A
# consumer's own qlty.toml still wins, but re-enabling a check switched off here
# needs enabled = true there too, because the two are merged, not replaced.
[smells]
mode = "comment"

[smells.function_parameters]
enabled = false

[smells.return_statements]
threshold = 9

[smells.function_complexity]
threshold = 43

[smells.file_complexity]
threshold = 400

# Every plugin definition here must carry exported_config_paths, even as an
# empty list. qlty resolves exported paths one definition at a time, in
# alphabetical order, and stops at the first without that key, so every plugin
# sorted after it silently falls back to its built-in configuration.
[plugins.definitions.markdownlint]
exported_config_paths = ["markdown/.markdownlint.json"]

[plugins.definitions.yamllint]
exported_config_paths = ["yaml/.yamllint.yaml"]

[plugins.definitions.shellcheck]
exported_config_paths = ["shell/.shellcheckrc"]

[plugins.definitions.biome]
exported_config_paths = ["js/biome.json"]
config_files = [".qlty/configs/biome.json"]

[plugins.definitions.biome.drivers.format]
script = "biome format --write ${config_script} ${target}"
config_script = "--config-path ${config_file}"
batch = true
cache_results = true
output = "rewrite"
suggested = "targets"

[plugins.definitions.biome.drivers.lint]
script = "biome lint --reporter=json ${config_script} ${target}"
config_script = "--config-path ${config_file}"

[plugins.definitions.knip]
exported_config_paths = ["js/knip.json"]

[plugins.definitions.eslint]
exported_config_paths = []
config_files = [".qlty/configs/eslint.config.mjs"]

# phpcs 4.x exits 3 when it reports findings, which qlty's driver treats as a
# crash, discarding every finding.
[plugins.definitions.php-codesniffer]
exported_config_paths = []

[plugins.definitions.php-codesniffer.drivers.lint]
success_codes = [0, 1, 2, 3]

# The sandbox install ignores the runner's PHP version, and php-cs-fixer accepts
# a Symfony 8 that needs PHP 8.4.1, so the tree is held below 8. A consumer adds
# only its sinemacula/coding-standards entry; the two lists are combined.
[plugins.definitions.php-cs-fixer]
exported_config_paths = []
extra_packages = [
    "symfony/console@^7.4",
    "symfony/event-dispatcher@^7.4",
    "symfony/filesystem@^7.4",
    "symfony/finder@^7.4",
    "symfony/options-resolver@^7.4",
    "symfony/process@^7.4",
    "symfony/stopwatch@^7.4",
    "symfony/string@^7.4",
]

[plugins.definitions.gitleaks]
exported_config_paths = ["security/.gitleaks.toml"]

[plugins.definitions.trivy]
exported_config_paths = ["security/trivy.yaml"]

[plugins.definitions.editorconfig-checker]
exported_config_paths = ["editorconfig/.editorconfig-checker.json"]

[plugins.definitions.swiftlint]
exported_config_paths = ["swift/.swiftlint.yml"]

[plugins.definitions.swiftformat]
exported_config_paths = ["swift/.swiftformat"]
