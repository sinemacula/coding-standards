config_version = "0"

# Release-please writes CHANGELOG.md with `*` bullets, which MD004 rejects.
[[exclude]]
plugins = ["markdownlint"]
file_patterns = ["**/CHANGELOG.md"]

# The qlty-generated git hooks are tab-indented.
[[exclude]]
plugins = ["editorconfig-checker"]
file_patterns = [".qlty/hooks/**"]

# Test code is exercised by the suite, so its smells are not reported here.
[[exclude]]
plugins = ["radarlint-php"]
file_patterns = ["tests/**"]

# The ESLint config lives under .qlty, and linting it would flag the file itself.
[[exclude]]
plugins = ["eslint"]
file_patterns = [".qlty/**"]

# terraform init downloads third-party modules into .terraform.
[[exclude]]
plugins = ["terraform", "tflint"]
file_patterns = ["**/.terraform/**"]

# S100 wants camelCase global functions, which ValidGlobalFunctionName forbids;
# PSR1 already covers methods.
[[triage]]
match.rules = ["radarlint-php:php:S100"]
set.ignored = true

# S1144 misses calls from a used trait or a first-class callable; PHPStan
# already reports unused private methods.
[[triage]]
match.rules = ["radarlint-php:php:S1144"]
set.ignored = true

# S1172 flags the leading parameters a framework callback must declare, which
# the phpcs ruleset allows.
[[triage]]
match.rules = ["radarlint-php:php:S1172"]
set.ignored = true

# A consumer on another PHP sets its own [runtimes.enabled].
[runtimes.enabled]
php = "8.5"

# A consumer's entry for one of these plugins inherits an unset version or mode,
# but any list it sets, drivers included, replaces this one; an entry with no
# drivers runs them all.
[[plugin]]
name = "trufflehog"

[[plugin]]
name = "markdownlint"
mode = "comment"

[[plugin]]
name = "yamllint"

[[plugin]]
name = "actionlint"

[[plugin]]
name = "osv-scanner"

[[plugin]]
name = "trivy"
drivers = ["config", "fs-vuln"]

[[plugin]]
name = "editorconfig-checker"

[[plugin]]
name = "php-codesniffer"
version = "4.0.4"
mode = "comment"

[[plugin]]
name = "php-cs-fixer"
version = "3.95.30"

# The analysis stack comes from each project's own package_file.
[[plugin]]
name = "phpstan"
version = "2.3.7"

[[plugin]]
name = "radarlint-php"
mode = "comment"

# Qlty's validate driver runs without terraform init and cannot pass, so only
# the formatter runs; validation belongs in the repository's own CI.
[[plugin]]
name = "terraform"
version = "1.16.5"
drivers = ["format"]

[[plugin]]
name = "tflint"
version = "0.64.0"

# A threshold flags at that value or more. The configs are merged, so a consumer
# re-enabling a check disabled here must set enabled = true.
[smells]
mode = "comment"

[smells.function_parameters]
enabled = false

[smells.return_statements]
threshold = 9

[smells.function_complexity]
threshold = 43

[smells.file_complexity]
threshold = 400

# Every definition needs exported_config_paths, even empty: qlty stops at the
# first definition without one, so later plugins fall back to built-in configs.
[plugins.definitions.markdownlint]
exported_config_paths = ["markdown/.markdownlint.json"]

[plugins.definitions.yamllint]
exported_config_paths = ["yaml/.yamllint.yaml"]

[plugins.definitions.shellcheck]
exported_config_paths = ["shell/.shellcheckrc"]

# No actionlint release knows the ubuntu-26.04 runner label yet. Remove the
# -ignore once one does.
[plugins.definitions.actionlint]
exported_config_paths = []

[plugins.definitions.actionlint.drivers.lint]
script = "actionlint -ignore 'label .ubuntu-26\\.04(-arm)?. is unknown' -format \"{{json .}}\" ${target}"

# Exported under a name of its own so it does not displace the project's
# .qlty/configs/biome.json, which extends it as ./biome.shared.json.
[plugins.definitions.biome]
exported_config_paths = ["js/biome.shared.json"]

[plugins.definitions.eslint]
exported_config_paths = []
config_files = [".qlty/configs/eslint.config.mjs"]

# phpcs 4.x exits 3 when it reports findings, which qlty's driver treats as a
# crash, discarding every finding.
[plugins.definitions.php-codesniffer]
exported_config_paths = []

[plugins.definitions.php-codesniffer.drivers.lint]
success_codes = [0, 1, 2, 3]

[plugins.definitions.php-cs-fixer]
exported_config_paths = []

[plugins.definitions.gitleaks]
exported_config_paths = ["security/.gitleaks.toml"]

[plugins.definitions.trivy]
exported_config_paths = ["security/trivy.yaml"]

# Pins the version a consumer runs without turning zizmor on for every consumer.
# Earlier releases skip reusable workflow references, which qlty Cloud reports.
[plugins.definitions.zizmor]
exported_config_paths = ["security/zizmor.yml"]
known_good_version = "1.32.0"

[plugins.definitions.editorconfig-checker]
exported_config_paths = ["editorconfig/.editorconfig-checker.json"]

[plugins.definitions.swiftlint]
exported_config_paths = ["swift/.swiftlint.yml"]

[plugins.definitions.swiftformat]
exported_config_paths = ["swift/.swiftformat"]

# TFLint reads .tflint.hcl from each module's directory, so without --config a
# nested module falls back to the default preset.
[plugins.definitions.tflint]
exported_config_paths = ["terraform/.tflint.hcl"]

[plugins.definitions.tflint.drivers.lint]
script = "tflint --format=sarif --force ${config_script}"
config_script = "--config=${config_file}"
