# A third party can move its tags, so its actions are pinned to a commit SHA.
rules:
    unpinned-uses:
        config:
            policies:
                actions/*: ref-pin
                github/*: ref-pin
                sinemacula/*: ref-pin
                '*': hash-pin

    # Flags every checkout that keeps its token, which release and deploy jobs
    # need.
    artipacked:
        disable: true

    # Only suggests the `$/` spelling for a repository's own reusable workflows.
    self-repository:
        disable: true
