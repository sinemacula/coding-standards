config_version = "0"

exclude_patterns = [
    ".sinemacula/**",
    "SineMacula/Tests/**/*.inc",
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/.yarn/**",
    "**/*.d.ts",
    "**/assets/**",
    "**/bower_components/**",
    "**/build/**",
    "**/cache/**",
    "**/config/**",
    "**/db/**",
    "**/deps/**",
    "**/dist/**",
    "**/extern/**",
    "**/external/**",
    "**/generated/**",
    "**/Godeps/**",
    "**/gradlew/**",
    "**/mvnw/**",
    "**/node_modules/**",
    "**/protos/**",
    "**/seed/**",
    "**/target/**",
    "**/templates/**",
    "**/testdata/**",
    "**/vendor/**",
]

test_patterns = [
    "**/test/**",
    "**/spec/**",
    # Match PHPUnit's PascalCase layout (Tests/, *Test.php); the defaults below
    # are lowercase-only, so without these qlty treats tests as source.
    "**/Tests/**",
    "**/*Test.php",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[runtimes.enabled]
php = "8.3"


[[plugin]]
name = "radarlint-php"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "editorconfig-checker"

# Dogfood this repo's own standards on its own code: phpcs and php-cs-fixer use
# the in-tree configs under .qlty/configs, not a released tag. slevomat comes
# from composer.json; the base class loads via .qlty/configs/autoload.php
# (qlty Cloud has no project vendor/autoload.php).
[[plugin]]
name = "php-codesniffer"
# Pinned to 4.0.1, the major consumers run via qlty; the suite is tested on both
# 3.x and 4.x in CI (the Tests workflow's phpcs matrix).
version = "4.0.1"
mode = "comment"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect"]

# phpcs 4.x exits 3 on errors (bitmask: 1 errors + 2 fixable), which qlty's
# built-in driver, written for 3.x exit semantics, treats as a plugin failure -
# silently discarding the findings. The self-lint resolves php-codesniffer from
# the default source (not this repo's source.toml), so the override that
# source.toml ships to consumers is mirrored here. 0/1/2/3 = "ran and found
# issues" on both majors; a real fatal exits higher (255) and still errors.
[plugins.definitions.php-codesniffer.drivers.lint]
success_codes = [0, 1, 2, 3]

# Pinned: 3.90+ pulls symfony/console 8 (needs PHP 8.4.1), which qlty's PHP 8.3
# runner cannot parse. Bump once the runner ships PHP 8.4.
[[plugin]]
name = "php-cs-fixer"
version = "3.89.0"
package_file = "composer.json"

# phpstan is NOT wired here: it needs the project vendor (composer install) that
# qlty Cloud lacks. Run it locally with `composer analyse` (phpstan.neon.dist).

# Dogfood this repo's own ESLint rules on its own rule source: the root
# eslint.config.js imports the in-tree js/eslint config and scopes it to
# js/eslint/**/*.js. package_file installs from package.json; the sandbox
# otherwise carries only eslint/jest/prettier, so the package_filters override
# is mirrored here (source-exported plugin definitions do not reliably
# propagate, the same reason the phpcs success_codes override is duplicated).
[[plugin]]
name = "eslint"
mode = "comment"
package_file = "package.json"
package_filters = ["@sinemacula/coding-standards", "typescript-eslint", "@typescript-eslint"]

# The RuleTester fixtures are TypeScript scaffolding the dogfood config does not
# lint (it targets js/eslint/**/*.js); excluding them keeps eslint from warning
# that it was handed an ignored file.
[[exclude]]
plugins = ["eslint"]
file_patterns = ["js/eslint/rules/__tests__/fixtures/**"]

# php/ and .qlty/configs hold tool configs, not source, so the PHP plugins skip
# them; php/ stays so the cs-fixer config can require its rules file.
[[exclude]]
plugins = ["php-codesniffer", "php-cs-fixer"]
file_patterns = ["php/**", ".qlty/configs/**"]

# Release-please writes CHANGELOG.md with long lines exceeding max_line_length,
# failing its release PRs. It is tool-generated, so exclude it from
# editorconfig-checker (mirrors the markdownlint exclude in source.toml).
[[exclude]]
plugins = ["editorconfig-checker"]
file_patterns = ["**/CHANGELOG.md"]
