config_version = "0"

exclude_patterns = [
    ".sinemacula/**",
    "SineMacula/Tests/**/*.inc",
    "SineMacula/Tests/**/*.inc.fixed",
    "*_min.*",
    "*-min.*",
    "*.min.*",
    "**/.yarn/**",
    "**/*.d.ts",
    "**/assets/**",
    "**/bower_components/**",
    "**/build/**",
    "**/cache/**",
    "**/config/**",
    "**/db/**",
    "**/deps/**",
    "**/dist/**",
    "**/extern/**",
    "**/external/**",
    "**/generated/**",
    "**/Godeps/**",
    "**/gradlew/**",
    "**/mvnw/**",
    "**/node_modules/**",
    "**/protos/**",
    "**/seed/**",
    "**/target/**",
    "**/templates/**",
    "**/testdata/**",
    "**/vendor/**",
]

test_patterns = [
    "**/test/**",
    "**/spec/**",
    # The defaults are lowercase-only; match PHPUnit's Tests/ and *Test.php.
    "**/Tests/**",
    "**/*Test.php",
    "**/*.test.*",
    "**/*.spec.*",
    "**/*_test.*",
    "**/*_spec.*",
    "**/test_*.*",
    "**/spec_*.*",
]

[smells]
mode = "comment"

[[source]]
name = "default"
default = true

[runtimes.enabled]
php = "8.5"


[[plugin]]
name = "radarlint-php"
mode = "comment"

[[plugin]]
name = "ripgrep"
mode = "comment"

[[plugin]]
name = "trufflehog"

[[plugin]]
name = "editorconfig-checker"

[[plugin]]
name = "markdownlint"
mode = "comment"

# Lint with the in-tree configs under .qlty/configs, not a released tag. qlty
# Cloud has no project vendor, so .qlty/configs/autoload.php loads the bases.
[[plugin]]
name = "php-codesniffer"
# The major consumers run. Composer refuses 4.x below 4.0.2 over a security
# advisory, which fails the plugin outright.
version = "4.0.4"
mode = "comment"
package_file = "composer.json"
package_filters = ["slevomat", "dealerdirect"]

# phpcs 4.x exits 3 on fixable errors, which qlty treats as a plugin failure
# and silently drops the findings. Mirrors the source.toml override, which the
# self-lint does not load.
[plugins.definitions.php-codesniffer.drivers.lint]
success_codes = [0, 1, 2, 3]

# The fixer config reads its rules from the working tree, so no package_file.
[[plugin]]
name = "php-cs-fixer"
version = "3.95.19"

# phpstan needs the project vendor, which qlty Cloud lacks; run `composer
# analyse` instead.

# php/ and .qlty/configs hold tool configs.
[[exclude]]
plugins = ["php-codesniffer", "php-cs-fixer"]
file_patterns = ["php/**", ".qlty/configs/**"]

# Release-please writes CHANGELOG.md with `*` bullets and long lines.
[[exclude]]
plugins = ["editorconfig-checker", "markdownlint"]
file_patterns = ["**/CHANGELOG.md"]

# The qlty-generated hooks are tab-indented.
[[exclude]]
plugins = ["editorconfig-checker"]
file_patterns = [".qlty/hooks/**"]

# Mirrors the source.toml triage: S100 fights the required snake_case global
# function names.
[[triage]]
match.rules = ["radarlint-php:php:S100"]
set.ignored = true

# S1144 and S1172 misread trait calls, first-class callables and framework
# callbacks.
[[triage]]
match.rules = ["radarlint-php:php:S1144"]
set.ignored = true

[[triage]]
match.rules = ["radarlint-php:php:S1172"]
set.ignored = true
